[package]
name = "onomancy_protocol"
version = "0.3.0"
description = "The sans-IO protocol machines for Onomancy: resolution, comparison, derivation"

authors.workspace = true
categories = ["data-structures", "no-std"]
edition.workspace = true
keywords = ["onomancy", "names", "resolution"]
license.workspace = true
readme = "./README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = { workspace = true }
onomancy_core = { workspace = true }
onomancy_dnssec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bolero = { workspace = true, features = ["arbitrary"] }
onomancy_protocol = { path = ".", features = ["test_utils"] }
testresult = { workspace = true }

[features]
default = []
std = ["onomancy_core/std", "onomancy_dnssec/std", "thiserror/std"]
test_utils = []                                                     # deterministic evidence factories

[lints]
workspace = true
