[package]
name = "onomancy_core"
version = "0.1.0"
description = "Core logic for Onomancer"

authors.workspace = true
categories = ["data-structures"]
edition.workspace = true
keywords = ["onomancy", "names"]
license.workspace = true
readme = "./README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true, features = ["derive"] }
bs58 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true, optional = true, features = ["alloc", "derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bolero = { workspace = true, features = ["arbitrary"] }
onomancy_core = { version = "0.1.0", path = ".", features = ["arbitrary"] }
testresult = { workspace = true }

[features]
default = []
arbitrary = ["dep:arbitrary", "std"]         # derive needs std's thread_local
serde = ["dep:serde"]
std = ["ed25519-dalek/std", "thiserror/std"]

[lints]
workspace = true
