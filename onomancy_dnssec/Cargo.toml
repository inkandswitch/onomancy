[package]
name = "onomancy_dnssec"
version = "0.3.0"
description = "Sans-IO DNSSEC chain validation for Onomancy: RFC 4034/4035 over supplied bytes"
readme = "./README.md"

repository.workspace = true
license.workspace = true
authors.workspace = true

categories = ["cryptography", "no-std"]
keywords = ["dns", "dnssec", "onomancy", "validation"]

edition.workspace = true
rust-version.workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true, features = ["derive"] }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
idna = { workspace = true, optional = true }
onomancy_core = { workspace = true }
p256 = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bolero = { workspace = true, features = ["arbitrary"] }
onomancy_dnssec = { path = ".", features = ["test_utils"] }
onomancy_protocol = { path = "../onomancy_protocol", default-features = false, features = ["std", "test_utils"] }
testresult = { workspace = true }

[features]
arbitrary = [
  "dep:arbitrary",
  "onomancy_core/arbitrary",
  "std",
] # derive needs std's thread_local
default = []
idna = ["dep:idna"] # U-label → A-label input layer
std = ["onomancy_core/std", "thiserror/std"]
test_utils = [] # synthetic-zone factories

[[example]]
name = "generate_fixtures"
required-features = ["test_utils", "std"]

[lints]
workspace = true
