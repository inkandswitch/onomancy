# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Alphabetized. Everything must be compatible with MIT OR Apache-2.0.
allow = [
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[advisories]
ignore = [
  # Marvin attack (timing sidechannel on RSA PRIVATE-key operations).
  # onomancy_dnssec uses `rsa` for signature VERIFICATION only — no RSA
  # private key exists anywhere in the system (DNSSEC verifiers never
  # sign; Onomancy's own signatures are Ed25519). Revisit when the rsa
  # crate ships its constant-time rewrite.
  { id = "RUSTSEC-2023-0071", reason = "verification-only use; Marvin requires private-key operations" },
]

[bans]
# Mirrors the workspace lint allowance for clippy::multiple_crate_versions.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
