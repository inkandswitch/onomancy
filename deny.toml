# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Alphabetized. Everything must be compatible with MIT OR Apache-2.0.
allow = [
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[advisories]
ignore = [
  # Marvin attack (timing sidechannel on RSA PRIVATE-key operations).
  # onomancy_dnssec uses `rsa` for signature VERIFICATION only — no RSA
  # private key exists anywhere in the system (DNSSEC verifiers never
  # sign; Onomancy's own signatures are Ed25519). Revisit when the rsa
  # crate ships its constant-time rewrite.
  { id = "RUSTSEC-2023-0071", reason = "verification-only use; Marvin requires private-key operations" },

  # bincode 1.3.3: development ceased; the team considers 1.3.3 complete.
  # It is Keyhive's wire encoding — onomancy_keyhive must speak
  # it, and carriage entries version-tag it (`kh0`) so a future encoding
  # change is a loud parse error. No security advisory, just unmaintained.
  { id = "RUSTSEC-2025-0141", reason = "keyhive_core's chosen encoding; version-tagged at our boundary" },

  # derivative: unmaintained proc-macro, transitive via keyhive_core
  # (pre-alpha). Compile-time only — no runtime attack surface.
  # Drops out when upstream migrates (tracked in keyhive coordination).
  { id = "RUSTSEC-2024-0388", reason = "transitive compile-time dep of keyhive_core" },
]

[bans]
# Mirrors the workspace lint allowance for clippy::multiple_crate_versions.
multiple-versions = "allow"
wildcards = "deny"
# Workspace-internal dev-dependencies (a crate depending on itself to
# switch on its own `test_utils`/`arbitrary` features) carry a path and
# no version, which reads as a wildcard. Scoped to path dependencies
# only — a registry dependency at `version = "*"` is still refused,
# verified by probe.
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
