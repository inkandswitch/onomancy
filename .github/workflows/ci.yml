name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned exactly: a floating tag would fail CI whenever a new
      # release learns new typos.
      - name: Spell check
        uses: crate-ci/typos@v1.49.0

  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ci-browser is the only job that EXECUTES wasm-target tests.
        # `tests/verify.rs` and `tests/browser.rs` are
        # `cfg(target_arch = "wasm32")`, so ci-test compiles them away
        # and reports "running 0 tests" — green, while looking at
        # nothing. Without this job those suites are ornamental.
        check:
          [
            ci-fmt,
            ci-clippy,
            ci-test,
            ci-wasm,
            ci-browser,
            ci-no-std,
            ci-deny,
            ci-e2e,
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: ${{ matrix.check }}
        run: nix run .#${{ matrix.check }}

  # Mutation testing, scoped to the PR's changed code (full-workspace runs
  # are hours; `nix run .#ci-mutants` does the deliberate full sweep
  # locally). Blocking: a missed mutant in code you touched fails the job.
  mutants:
    name: ci-mutants (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with the target branch exists.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Diff against the merge base
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      - name: ci-mutants
        run: nix run .#ci-mutants -- --in-diff pr.diff

      # mutants.out holds the missed/caught/timeout lists and per-mutant
      # logs — the thing to read when the job goes red.
      - name: Upload mutants report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out
          if-no-files-found: ignore
