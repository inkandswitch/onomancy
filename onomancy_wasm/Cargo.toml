[package]
name = "onomancy_wasm"
version = "0.1.0"
description = "Wasm/JavaScript bindings for Onomancer (browser and Node.js)"
categories = ["web-programming"]
keywords = ["onomancy", "wasm"]
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "./README.md"
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
automerge = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true }
ed25519-dalek = { workspace = true, optional = true }
# Seed minting + automerge's RNG; the `wasm_js` feature unlocks the
# backend that .cargo/config.toml's `getrandom_backend` cfg selects.
getrandom = { workspace = true, features = ["wasm_js"], optional = true }
# The RustCrypto stack (rand_core 0.6 under ed25519-dalek and p256)
# still speaks getrandom 0.2 on wasm32; this dep exists only to switch
# on its `js` backend. No onomancy code calls 0.2 — seed minting uses
# the 0.4 entry above.
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = [
  "js",
] }
hickory-proto = { workspace = true, optional = true }
js-sys = { workspace = true }
onomancy_automerge = { workspace = true, optional = true }
onomancy_chain = { workspace = true, optional = true }
onomancy_core = { workspace = true }
onomancy_dnssec = { workspace = true, optional = true, features = ["std"] }
onomancy_protocol = { workspace = true, optional = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, optional = true, features = [
  "Headers",
  "Request",
  "RequestInit",
  "Response",
] }

[dev-dependencies]
# Exact-pinned lockstep with wasm-bindgen =0.2.121 (runner schema must match).
wasm-bindgen-test = "=0.3.71"

[features]
default = ["doh", "names"]
names = [
  "dep:automerge",
  "dep:ed25519-dalek",
  "dep:getrandom",
  "dep:onomancy_automerge",
  "dep:onomancy_protocol",
  "std",
]
doh = [
  "dep:hickory-proto",
  "dep:onomancy_chain",
  "dep:onomancy_dnssec",
  "dep:onomancy_protocol",
  "dep:web-sys",
  "onomancy_core/idna",
  "std",
]
live = []
std = [
  "js-sys/std",
  "onomancy_core/std",
  "thiserror/std",
  "wasm-bindgen/std",
  "wasm-bindgen-futures/std",
]

[lints]
workspace = true
