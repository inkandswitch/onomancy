[package]
name = "onomancy_hickory"
version = "0.1.0"
description = "Host DNSSEC chain courier for Onomancy, built on hickory-proto"
readme = "./README.md"

repository.workspace = true
license.workspace = true
authors.workspace = true

categories = ["network-programming"]
keywords = ["dns", "dnssec", "onomancy"]

edition.workspace = true
rust-version.workspace = true

[dependencies]
# default-features = false deliberately: proto's `std` exists only to
# feed `Message::query()`'s random IDs (rand/thread_rng → getrandom),
# and our IDs are explicit — keeps getrandom out of the wasm graph.
hickory-proto = { workspace = true }
onomancy_core = { workspace = true, features = ["std"] }
onomancy_protocol = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = [
  "io-util",
  "net",
  "time",
] }
tracing = { workspace = true }

[features]
default = ["sockets"]
sockets = ["dep:tokio"] # the OS-socket stub; off = assembly only (wasm)

[dev-dependencies]
onomancy_dnssec = { workspace = true, features = ["std"] }
testresult = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
