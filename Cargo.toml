[workspace]
resolver = "3"
members = [
  "onomancer",
  "onomancy_automerge",
  "onomancy_chain",
  "onomancy_core",
  "onomancy_dnssec",
  "onomancy_hickory",
  "onomancy_keyhive",
  "onomancy_protocol",
  "onomancy_publish",
  "onomancy_wasm",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/expede/onomancy"
authors = ["Brooklyn Zelenka <hello@brooklynzelenka.com>"]

[workspace.dependencies]
# Internal crates
onomancy_automerge = { version = "0.1.0", path = "onomancy_automerge", default-features = false }
onomancy_chain = { version = "0.1.0", path = "onomancy_chain", default-features = false }
onomancy_core = { version = "0.1.0", path = "onomancy_core", default-features = false }
onomancy_dnssec = { version = "0.1.0", path = "onomancy_dnssec", default-features = false }
onomancy_hickory = { version = "0.1.0", path = "onomancy_hickory", default-features = false }
onomancy_keyhive = { version = "0.1.0", path = "onomancy_keyhive", default-features = false }
onomancy_protocol = { version = "0.1.0", path = "onomancy_protocol", default-features = false }
onomancy_publish = { version = "0.1.0", path = "onomancy_publish", default-features = false }
onomancy_wasm = { version = "0.1.0", path = "onomancy_wasm", default-features = false }

# External crates
arbitrary = "1.4"
automerge = { version = "0.11", default-features = false }
clap = { version = "4.6", features = ["derive"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
bijoux = { version = "0.3", default-features = false, features = ["u64"] }
blake3 = { version = "1.8", default-features = false }
bincode = { version = "1.3", default-features = false }
bolero = "0.13"
bs58 = { version = "0.5", default-features = false, features = [
  "alloc",
  "check",
] }
console_error_panic_hook = "0.1.7"
ed25519-dalek = { version = "2.2", default-features = false }
future_form = { version = "0.3", default-features = false }
futures = { version = "0.3", default-features = false, features = ["executor"] }
getrandom = "0.2"
hickory-proto = { version = "0.26", default-features = false }
keyhive_core = { version = "0.5", default-features = false } # pre-alpha, adopted by ADR-056
keyhive_crypto = { version = "0.2", default-features = false }
idna = { version = "1.1", default-features = false, features = [
  "alloc",
  "compiled_data",
] }
js-sys = { version = "0.3", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
rsa = { version = "0.9", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
serde = { version = "1.0", default-features = false }
testresult = "0.4"
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false }
wasm-bindgen = { version = "=0.2.121", default-features = false } # exact-pinned to the flake's wasm-bindgen-cli
web-sys = { version = "0.3", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }

rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_extern_crates = "deny"

unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
fallible_impl_from = "warn"
fn_params_excessive_bools = "warn"
indexing_slicing = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
panic = "warn"
todo = "warn"
unneeded_field_pattern = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"            # various transitive deps
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

# Preserve the Wasm name section for readable stack traces in production.
# Only strips DWARF debug info, not function names.
[profile.release.package.onomancy_wasm]
strip = "debuginfo"

# Debug-oriented Wasm profile. Preserves DWARF so Chrome DevTools
# (with the C/C++ DevTools Support extension) can step through.
# Built via wasm-bodge with `--debug-profile wasm-debug`.
[profile.wasm-debug]
inherits = "release"
codegen-units = 16
debug = "limited"
debug-assertions = true
lto = "thin"
opt-level = 1
overflow-checks = true
strip = "none"

[profile.wasm-debug.package.onomancy_wasm]
strip = "none"
